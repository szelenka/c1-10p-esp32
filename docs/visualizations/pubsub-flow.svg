  <rect class="bg" x="0" y="0" width="1400" height="1060"/>
  <text class="title" x="48" y="56">How a controller command reaches the robot</text>
  <text class="subtitle" x="48" y="88">Nodes are workers. Topics are mailboxes. Bridges are safety gates before hardware.</text>
  <text class="band-title" x="50" y="142">1. Input</text>
  <text class="band-title" x="270" y="142">2. Mailboxes</text>
  <text class="band-title" x="500" y="142">3. Decide action</text>
  <text class="band-title" x="765" y="142">4. Command mailboxes</text>
  <text class="band-title" x="1010" y="142">5. Safety gates</text>
  <text class="band-title" x="1215" y="142">6. Hardware</text>
  <rect class="input" x="42" y="176" width="170" height="118" rx="8"/>
  <text class="box-title" x="62" y="212">Controllers</text>
  <text class="box-text" x="62" y="240">Buttons</text>
  <text class="box-text" x="62" y="262">Sticks</text>
  <text class="box-text" x="62" y="284">Bluetooth reports</text>
  <rect class="input" x="42" y="352" width="170" height="132" rx="8"/>
  <text class="box-title" x="62" y="388">BluepadInputNode</text>
  <text class="box-text" x="62" y="416">Maps raw input</text>
  <text class="box-text" x="62" y="438">to intents:</text>
  <text class="box-text" x="62" y="460">drive, dome, etc.</text>
  <rect class="topic" x="268" y="179" width="172" height="82" rx="8"/>
  <text class="box-title" x="288" y="213">controller/drive</text>
  <text class="small" x="288" y="239">drive controller mail</text>
  <rect class="topic" x="268" y="359" width="172" height="82" rx="8"/>
  <text class="box-title" x="288" y="393">controller/dome</text>
  <text class="small" x="288" y="419">dome controller mail</text>
  <rect class="action" x="506" y="164" width="178" height="112" rx="8"/>
  <text class="box-title" x="526" y="200">DriveNode</text>
  <text class="box-text" x="526" y="228">Turns stick input</text>
  <text class="box-text" x="526" y="250">into left/right</text>
  <text class="box-text" x="526" y="272">motor speed</text>
  <rect class="action" x="506" y="334" width="178" height="132" rx="8"/>
  <text class="box-title" x="526" y="370">DomeNode</text>
  <text class="box-text" x="526" y="398">Dome spin</text>
  <text class="box-text" x="526" y="420">Face tracking</text>
  <text class="box-text" x="526" y="442">Eye LED commands</text>
  <rect class="action" x="506" y="514" width="178" height="132" rx="8"/>
  <text class="box-title" x="526" y="550">Servo action nodes</text>
  <text class="box-text" x="526" y="578">Neck</text>
  <text class="box-text" x="526" y="600">Periscope</text>
  <text class="box-text" x="526" y="622">Dome arms</text>
  <rect class="action" x="506" y="708" width="178" height="104" rx="8"/>
  <text class="box-title" x="526" y="744">SoundNode</text>
  <text class="box-text" x="526" y="772">Chooses sounds</text>
  <text class="box-text" x="526" y="794">and volume</text>
  <rect class="topic" x="765" y="179" width="172" height="82" rx="8"/>
  <text class="box-title" x="785" y="213">drive/cmd</text>
  <text class="small" x="785" y="239">wheel motor mail</text>
  <rect class="topic" x="765" y="359" width="172" height="82" rx="8"/>
  <text class="box-title" x="785" y="393">dome/motor/cmd</text>
  <text class="small" x="785" y="419">dome motor mail</text>
  <rect class="topic" x="765" y="539" width="172" height="82" rx="8"/>
  <text class="box-title" x="785" y="573">servo/*/cmd</text>
  <text class="small" x="785" y="599">servo command mail</text>
  <rect class="topic" x="765" y="719" width="172" height="82" rx="8"/>
  <text class="box-title" x="785" y="753">audio/cmd</text>
  <text class="small" x="785" y="779">sound command mail</text>
  <rect class="bridge" x="1012" y="164" width="168" height="112" rx="8"/>
  <text class="box-title" x="1032" y="200">MotorBridgeNode</text>
  <text class="box-text" x="1032" y="228">Checks safety</text>
  <text class="box-text" x="1032" y="250">then forwards</text>
  <rect class="bridge" x="1012" y="344" width="168" height="112" rx="8"/>
  <text class="box-title" x="1032" y="380">MotorBridgeNode</text>
  <text class="box-text" x="1032" y="408">Checks safety</text>
  <text class="box-text" x="1032" y="430">then forwards</text>
  <rect class="bridge" x="1012" y="524" width="168" height="112" rx="8"/>
  <text class="box-title" x="1032" y="560">ServoBridgeNode</text>
  <text class="box-text" x="1032" y="588">Checks safety</text>
  <text class="box-text" x="1032" y="610">then forwards</text>
  <rect class="bridge" x="1012" y="704" width="168" height="112" rx="8"/>
  <text class="box-title" x="1032" y="740">AudioBridgeNode</text>
  <text class="box-text" x="1032" y="768">Forwards sound</text>
  <text class="box-text" x="1032" y="790">commands</text>
  <rect class="hardware" x="1216" y="158" width="142" height="124" rx="8"/>
  <text class="box-title" x="1236" y="194">Sabertooth</text>
  <text class="box-text" x="1236" y="222">Address 129</text>
  <text class="box-text" x="1236" y="244">Feet motors</text>
  <text class="small" x="1236" y="266">38400 baud</text>
  <rect class="hardware" x="1216" y="338" width="142" height="124" rx="8"/>
  <text class="box-title" x="1236" y="374">SyRen</text>
  <text class="box-text" x="1236" y="402">Address 128</text>
  <text class="box-text" x="1236" y="424">Dome motor</text>
  <text class="small" x="1236" y="446">0xAA after 2s</text>
  <rect class="hardware" x="1216" y="518" width="142" height="124" rx="8"/>
  <text class="box-title" x="1236" y="554">Maestro</text>
  <text class="box-text" x="1236" y="582">Body + dome</text>
  <text class="box-text" x="1236" y="604">servos</text>
  <rect class="hardware" x="1216" y="698" width="142" height="124" rx="8"/>
  <text class="box-title" x="1236" y="734">MP3 Trigger</text>
  <text class="box-text" x="1236" y="762">Plays tracks</text>
  <text class="box-text" x="1236" y="784">Sets volume</text>
  <rect class="telemetry" x="744" y="846" width="224" height="88" rx="8"/>
  <text class="box-title" x="764" y="882">Telemetry tap</text>
  <text class="box-text" x="764" y="906">Listens to mailbox copies</text>
  <text class="box-text" x="764" y="928">for UI/dashboard</text>
  <rect class="note" x="42" y="718" width="360" height="166" rx="8"/>
  <text class="box-title" x="64" y="754">Safety rule</text>
  <text class="box-text" x="64" y="784">Motor and servo commands must pass</text>
  <text class="box-text" x="64" y="810">through a bridge node before hardware.</text>
  <text class="box-text" x="64" y="842">If the robot is in SAFE_STOP, the</text>
  <text class="box-text" x="64" y="868">bridge drops the command.</text>
  <rect class="note" x="42" y="970" width="1316" height="56" rx="8"/>
  <text class="box-text" x="64" y="1004">Simple version: controller says what you want, action nodes decide the command, bridge nodes check safety, then hardware gets bytes.</text>
