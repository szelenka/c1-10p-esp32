name: Host Test Matrix

on:
  push:
  pull_request:

jobs:
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python

      - name: Run host tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: make test

      - name: Run host tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test
