<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telemetry UI</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.160.0",
      "three/": "https://esm.sh/three@0.160.0/"
    }
  }
  </script>
</head>
<body>
  <main class="layout">
    <div class="robot-wrap">
      <div id="robotViewport" class="robot-viewport">
        <!-- JoyCon overlays are generated by app.js -->
        <div class="joycon-overlay jc-corner-bl" id="jc-slot-0"></div>
        <div class="joycon-overlay jc-corner-br" id="jc-slot-1"></div>
        <div class="joycon-overlay jc-corner-tl" id="jc-slot-2"></div>
        <div class="joycon-overlay jc-corner-tr" id="jc-slot-3"></div>
        <div class="label-layer hidden" id="labelLayer"></div>
        <div class="debug-overlay hidden" id="debugOverlay">
          <div class="debug-section" data-debug-section="perf">
            <strong>Performance</strong>
            <div id="debugPerf">--</div>
          </div>
          <div class="debug-section" data-debug-section="safety">
            <strong>Safety</strong>
            <div id="debugSafety">--</div>
          </div>
          <div class="debug-section" data-debug-section="motors">
            <strong>Motors</strong>
            <div id="debugMotors">--</div>
          </div>
          <div class="debug-section" data-debug-section="servos">
            <strong>Servos</strong>
            <div id="debugServos">--</div>
          </div>
          <div class="debug-section" data-debug-section="leds">
            <strong>LEDs</strong>
            <div id="debugLeds">--</div>
          </div>
          <div class="debug-section" data-debug-section="sound">
            <strong>Sound</strong>
            <div id="debugSound">--</div>
          </div>
        </div>
        <div class="viewport-toolbar-wrap" id="toolbarWrap">
          <button class="toolbar-chevron" id="toolbarChevron" title="Toggle toolbar">&#9660;</button>
          <div class="viewport-toolbar" id="viewportToolbar">
            <div class="debug-menu-wrap">
              <button class="nav-toggle" id="toggleDebugMenu">Debug &#9662;</button>
              <div class="debug-menu hidden" id="debugMenu">
                <label class="debug-menu-item debug-menu-all"><input type="checkbox" id="debugToggleAll" checked> All</label>
                <div class="debug-menu-divider"></div>
                <label class="debug-menu-item"><input type="checkbox" data-debug="perf" checked> Performance</label>
                <label class="debug-menu-item"><input type="checkbox" data-debug="safety" checked> Safety</label>
                <label class="debug-menu-item"><input type="checkbox" data-debug="motors"> Motors</label>
                <label class="debug-menu-item"><input type="checkbox" data-debug="servos"> Servos</label>
                <label class="debug-menu-item"><input type="checkbox" data-debug="leds"> LEDs</label>
                <label class="debug-menu-item"><input type="checkbox" data-debug="sound"> Sound</label>
              </div>
            </div>
            <button class="nav-toggle" id="resetViewBtn">Reset View</button>
            <div class="status" id="statusPill">
              <span class="status-icon" id="statusIcon">&#9679;</span>
              <span id="statusLabel">Connecting</span>
            </div>
            <div class="status-detail" id="statusDetail"></div>
          </div>
        </div>
        <div class="camera-bar" id="cameraBar"></div>
      </div>
      <div id="robotLegend" class="robot-legend">
        <span><strong>Mode:</strong> <span id="robotMode">loading...</span></span>
        <span id="legendAudio" class="legend-audio"></span>
        <span class="controls-hint">Left-drag: rotate &middot; Right-drag: pan &middot; Scroll: zoom</span>
      </div>
    </div>
  </main>

  <script type="module" src="/static/render3d.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
